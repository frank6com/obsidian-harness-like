# Release 发布（全自动）：推版本 tag 时在 CI 中构建插件包，
# 生成 Artifact Attestations（可验证的构建来源证明）并发布 release 资产。
# 历史教训：API 创建 release 不触发 Actions 的 release 事件；attestation 需 attestations: write 权限。
name: release

on:
  push:
    tags: ['*.*.*']
  # 手动补跑（对既有版本补 attestation；无 tag 时只构建+attest，不发布）
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin package
        run: pnpm build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "Harness Like $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
